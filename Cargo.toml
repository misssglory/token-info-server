[package]
name = "token-info-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# HTTP client with rustls
reqwest = { version = "0.13.3", features = ["json", "stream"], default-features = false }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
anyhow = "1.0"
async-trait = "0.1"
thiserror = "2.0"
hex = "0.4"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Solana dependencies
solana-client = "3.1.8"
solana-rpc-client = "3.1.8"
solana-account-decoder = "3.1.8"
solana-account-decoder-client-types = "3.1.8"
solana-streamer = "3.1.8"
solana-quic-client = "3.1.8"
solana-pubsub-client = "3.1.8"
solana-perf = "3.1.8"
solana-rayon-threadlimit = "3.1.8"
solana-commitment-config = "3.1.0"
solana-program = "3.0.0"
solana-sdk = "3.0.0"

spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { git = "https://github.com/misssglory/token-2022.git", branch = "try_fix_type_mismatch" }

# Optional
futures = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dotenv = "0.15.0"
once_cell = "1.21.4"
toml = "1.1.2"
spl-token-metadata-interface = "1.0.0"
base64 = "0.22.1"
