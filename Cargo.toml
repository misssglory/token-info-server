[package]
name = "token-info-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# HTTP client with rustls (no OpenSSL dependency)
reqwest = { version = "0.13.3", features = ["json"], default-features = false }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
anyhow = "1.0"
async-trait = "0.1"
thiserror = "2.0"
hex = "0.4"

# Solana - Using consistent versions
solana-client = "3.1.14"
solana-sdk = "3.0.0"
solana-program = "4.0.0"
solana-rpc-client = "3.1.14"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }

# Alloy for Ethereum/BSC - Using latest compatible
alloy = { version = "2.0.1", features = ["full", "rpc-types-eth", "provider-http", "contract"] }
alloy-provider = "2.0.1"
alloy-transport-http = "2.0.1"
alloy-primitives = "1.5.7"

# Optional: For better error handling
futures = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dotenv = "0.15.0"
once_cell = "1.21.4"
